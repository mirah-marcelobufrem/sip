services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sip
      POSTGRES_PASSWORD: sip
      POSTGRES_DB: sip
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sip -d sip"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sip:sip@postgres:5432/sip
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-change-in-production}
      JWT_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PORT: 3001
      NODE_ENV: development
      STORAGE_PATH: /app/uploads
      # File-change events don't propagate through the macOS/Windows bind
      # mount, so tsx watch never reloads; poll instead (chokidar env vars).
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - uploads:/app/uploads
      - ./backend:/app
      - backend_modules:/app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm ci && npm run db:migrate && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_URL: /api/v1
      BACKEND_URL: http://backend:3001
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  postgres_data:
  uploads:
  backend_modules:
  frontend_modules:
